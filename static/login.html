<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>novel-webui · 登录</title>
<style>
:root{ --bg:#0f1117; --panel:#171a23; --panel2:#1e2230; --line:#2a2f40;
  --text:#e6e9f0; --muted:#8b93a7; --accent:#4f8cff; --accent2:#3d6fd8;
  --ok:#34c98f; --err:#ff5c6c;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(380px,94vw);background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{font-size:19px;letter-spacing:.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 24px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.f label{font-size:12.5px;color:var(--muted)}
input{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:11px 12px;outline:none;font-size:14px;font-family:inherit}
input:focus{border-color:var(--accent)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;
  background:var(--accent);color:#fff;padding:12px;font-size:14px;font-weight:600;width:100%}
button:hover{background:var(--accent2)}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{font-size:12.5px;line-height:1.5;margin-top:14px;min-height:1em;overflow-wrap:anywhere}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.foot{font-size:11.5px;color:var(--muted);margin-top:18px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h1>novel-<span>webui</span></h1>
  <div class="sub">登录后继续使用</div>
  <form id="f">
    <div class="f"><label for="u">账号</label>
      <input id="u" name="username" autocomplete="username" required autofocus></div>
    <div class="f"><label for="p">密码</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button id="btn" type="submit">登 录</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="foot" id="hint"></div>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const msgEl = $('msg'), btn = $('btn'), hint = $('hint');
  if(new URLSearchParams(location.search).get('created') === '1'){
    hint.style.color = 'var(--ok)';
    hint.textContent = '账号已创建，请登录';
  }
  async function init(){
    try{
      const s = await (await fetch('/api/auth_state')).json();
      if(s.setup_required){ location.replace('/setup.html'); return; }
      if(s.authed){ location.replace('/'); return; }
    }catch(e){ msgEl.textContent = '无法连接服务，请确认后端已启动'; msgEl.className = 'msg err'; }
  }
  $('f').addEventListener('submit', async ev=>{
    ev.preventDefault();
    btn.disabled = true; msgEl.textContent = '';
    try{
      const r = await fetch('/api/login', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:$('u').value.trim(), password:$('p').value})});
      const d = await r.json();
      if(r.ok && d.ok){ location.replace('/'); return; }
      msgEl.textContent = d.message || '登录失败';
      msgEl.className = 'msg err';
      $('p').select();
    }catch(e){ msgEl.textContent = '网络错误，请重试'; msgEl.className = 'msg err'; }
    btn.disabled = false;
  });
  init();
})();
</script>
</body>
</html>
