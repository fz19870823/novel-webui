<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>novel-webui · 首次初始化</title>
<style>
:root{ --bg:#0f1117; --panel:#171a23; --panel2:#1e2230; --line:#2a2f40;
  --text:#e6e9f0; --muted:#8b93a7; --accent:#4f8cff; --accent2:#3d6fd8;
  --ok:#34c98f; --warn:#ffb648; --err:#ff5c6c;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,94vw);background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{font-size:19px;letter-spacing:.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 22px;line-height:1.6}
.warn{background:#2a2416;border:1px solid #4a3a1e;color:var(--warn);border-radius:8px;
  font-size:12.5px;line-height:1.6;padding:10px 12px;margin-bottom:18px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.f label{font-size:12.5px;color:var(--muted)}
input{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:11px 12px;outline:none;font-size:14px;font-family:inherit}
input:focus{border-color:var(--accent)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;
  background:var(--accent);color:#fff;padding:12px;font-size:14px;font-weight:600;width:100%}
button:hover{background:var(--accent2)}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{font-size:12.5px;line-height:1.5;margin-top:14px;min-height:1em;overflow-wrap:anywhere}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.foot{font-size:11.5px;color:var(--muted);margin-top:18px;text-align:center;line-height:1.6}
/* 移动端适配 */
@media (max-width:560px){
  body{justify-content:flex-start;padding:max(24px,env(safe-area-inset-top)) 16px 16px}
  .card{width:100%;padding:26px 20px}
  input,button{font-size:16px}   /* 防 iOS 聚焦自动缩放 */
  .warn{font-size:12px}
}
</style>
</head>
<body>
<div class="card">
  <h1>novel-<span>webui</span></h1>
  <div class="sub">首次启动 · 创建管理员账号</div>
  <div class="warn">本服务已开启登录鉴权。请设置唯一的<strong>管理员账号</strong>，
    保存后不可重复设置，之后每次访问都需登录。<br>
    需要<strong>初始化口令</strong>：见服务启动日志中的「🔐 初始化口令」一行，
    或数据目录下的 <code>.setup_token</code> 文件（创建管理员后自动失效）。</div>
  <form id="f">
    <div class="f"><label for="tk">初始化口令（setup token）</label>
      <input id="tk" name="token" autocomplete="off" spellcheck="false" required autofocus></div>
    <div class="f"><label for="u">账号（2-32 个字符，不含空格）</label>
      <input id="u" name="username" autocomplete="username" required></div>
    <div class="f"><label for="p">密码（至少 6 位）</label>
      <input id="p" name="password" type="password" autocomplete="new-password" required></div>
    <div class="f"><label for="p2">确认密码</label>
      <input id="p2" name="confirm" type="password" autocomplete="new-password" required></div>
    <button id="btn" type="submit">创建并保存</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="foot">忘记密码：删除数据目录下的 auth_users.json 后重启服务，可重新初始化。</div>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const msgEl = $('msg'), btn = $('btn');
  async function init(){
    try{
      const s = await (await fetch('/api/auth_state')).json();
      if(!s.setup_required){ location.replace('/login.html'); return; }
    }catch(e){ /* 服务未就绪时仍可先填表 */ }
  }
  $('f').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const tk = $('tk').value.trim();
    const u = $('u').value.trim(), p = $('p').value, p2 = $('p2').value;
    if(!tk){ return fail('请填写初始化口令（见服务启动日志）'); }
    if(u.length < 2){ return fail('账号至少 2 个字符'); }
    if(/\s/.test(u)){ return fail('账号不能含空格'); }
    if(p.length < 6){ return fail('密码至少 6 位'); }
    if(p !== p2){ return fail('两次输入的密码不一致'); }
    btn.disabled = true; msgEl.textContent = '';
    try{
      const r = await fetch('/api/setup', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:tk, username:u, password:p, confirm:p2})});
      const d = await r.json();
      if(r.ok && d.ok){ location.replace('/login.html?created=1'); return; }
      fail(d.message || '创建失败');
    }catch(e){ fail('网络错误，请重试'); }
    btn.disabled = false;
  });
  function fail(msg){
    msgEl.textContent = msg; msgEl.className = 'msg err';
    btn.disabled = false;
  }
  init();
})();
</script>
</body>
</html>
